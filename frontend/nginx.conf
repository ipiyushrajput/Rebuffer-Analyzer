# nginx for the frontend container. The StreamLens locations come from
# nginx/streamlens-locations.conf.template, rendered at start-up into /etc/nginx/streamlens/ —
# the same file deploy/install.sh renders on bare metal.
#
# Port 8001 belongs to the existing Metanalyser backend and is never used here.
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/streamlens/locations.conf;

    location = / {
        absolute_redirect off;
        return 302 /streamlens/;
    }
}
