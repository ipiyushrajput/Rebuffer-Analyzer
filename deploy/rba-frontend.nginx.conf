# nginx site for the RBA frontend on 107.109.131.68:8080.
# Install to /etc/nginx/conf.d/rba.conf and reload nginx.
#
# Port 8001 belongs to the existing Metanalyser backend and is never used here.

server {
    listen 8080;
    server_name 107.109.131.68 _;

    root /opt/rba/frontend/dist;
    index index.html;

    access_log /var/log/nginx/rba-access.log;
    error_log  /var/log/nginx/rba-error.log;

    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reports and evidence bundles stream; buffering would hold them in memory.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # An aging job streams for up to 24 hours.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
