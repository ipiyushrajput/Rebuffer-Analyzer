# nginx site for the StreamLens frontend on 107.109.131.68:8080.
# deploy/install.sh installs it to /etc/nginx/conf.d/rba.conf, with the port it was given.
#
# The app lives under /streamlens/ (the snippet below, rendered from
# frontend/nginx/streamlens-locations.conf.template), so this server claims nothing else. On a
# host whose own site already serves `/`, skip this file (install.sh --snippet-only) and put
# the include line inside that site's server block instead.
#
# Port 8001 belongs to the existing Metanalyser backend and is never used here.

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/rba-access.log;
    error_log  /var/log/nginx/rba-error.log;

    # Load balancer health check on this port.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/streamlens.conf;

    # This server exists only for StreamLens, so its root sends a visitor to the app.
    location = / {
        absolute_redirect off;
        return 302 /streamlens/;
    }
}
