name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type check
        working-directory: backend
        run: mypy

      - name: Test
        working-directory: backend
        env:
          DB_ENGINE: sqlite
        run: pytest -q

      - name: Confirm docs/RULES.md matches the registry
        working-directory: backend
        run: |
          python -m app.cli rules --markdown > /tmp/RULES.md
          diff -u ../docs/RULES.md /tmp/RULES.md

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Confirm no AI attribution reached the history
        run: |
          if git log --format=%B -50 | grep -iE '^Co-Authored-By:.*(claude|anthropic)|Generated with \[Claude Code\]|^Claude-Session:'; then
            echo "An attribution trailer reached a commit message." >&2
            exit 1
          fi
          echo "No attribution trailer found in the last 50 commits."
