# The database is the existing external server configured in backend/.env, not a container.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rba-backend:1.0.0
    container_name: rba-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      RBA_HOST: 0.0.0.0
      RBA_PORT: "8010"
      RBA_DATA_DIR: /var/lib/rba
      RBA_REPORTS_DIR: /var/lib/rba/reports
      RBA_EVIDENCE_DIR: /var/lib/rba/evidence
      # Recordings and local object storage on the volume, so a rebuilt container keeps them.
      # In production RBA_STORAGE_BACKEND=s3 (backend/.env) sends finished runs to S3.
      RBA_RECORDINGS_DIR: /var/lib/rba/recordings
      RBA_STORAGE_DIR: /var/lib/rba/storage
    volumes:
      - rba-data:/var/lib/rba
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health/live').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # The same cap as deploy/rba-backend.service (MemoryMax=6G).
          memory: 6G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The UI is served under /streamlens/; the page calls /streamlens/api and /streamlens/ws
        # on its own origin, so no address is built into it.
        VITE_BASE_PATH: /streamlens/
    image: rba-frontend:1.0.0
    container_name: rba-frontend
    restart: unless-stopped
    environment:
      # The backend as nginx reaches it. Running only the frontend here with the backend on
      # another machine: STREAMLENS_BACKEND=10.0.0.5:8010 docker compose up -d --no-deps frontend
      STREAMLENS_BACKEND: ${STREAMLENS_BACKEND:-backend:8010}
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  rba-data:
